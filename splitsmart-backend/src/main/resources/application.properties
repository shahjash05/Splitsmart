# Server
server.port=${PORT:8080}

# Spring Main Configuration
spring.main.lazy-initialization=true

# Database - MySQL running with empty root password (initialized fresh)
spring.datasource.url=jdbc:mysql://localhost:3306/splitsmart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Connection Pool (HikariCP) Optimization for Render Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=splitsmart-super-secret-key-change-this-in-production-min-256-bits
jwt.expiration=86400000

# Logging
logging.level.com.splitsmart=INFO
logging.level.org.springframework.security=WARN

