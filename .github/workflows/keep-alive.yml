name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes (cron syntax)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Endpoint
        run: |
          # We ping the dedicated public ping endpoint
          curl -s -o /dev/null -w "%{http_code}" https://splitsmart-ud5i.onrender.com/api/auth/ping
